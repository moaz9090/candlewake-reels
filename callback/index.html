<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Login callback · Candlewake</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --text:#e8e8ea; --muted:#a0a3ab; --accent:#ff9f1c; --bad:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:20px; }
  .card { width:100%; max-width:560px; background:var(--card); border-radius:12px; padding:28px; }
  h1 { font-size:1.4rem; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 16px; }
  textarea { width:100%; height:110px; resize:none; background:#0b0d11; color:var(--text); border:1px solid #2a2f3a;
             border-radius:8px; padding:12px; font:14px/1.4 ui-monospace,Consolas,monospace; }
  button { margin-top:12px; background:var(--accent); color:#111; border:0; border-radius:8px; padding:10px 18px;
           font-weight:600; font-size:15px; cursor:pointer; }
  .error { color:var(--bad); }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Login callback</h1>
  <p id="msg">Waiting for a login code…</p>
  <textarea id="out" readonly hidden></textarea>
  <button id="copy" hidden>Copy full URL</button>
</div>
<script>
  // Only displays what is in this page's own address bar; nothing is sent anywhere.
  const params = new URLSearchParams(window.location.search);
  const title = document.getElementById("title");
  const msg = document.getElementById("msg");
  const out = document.getElementById("out");
  const copy = document.getElementById("copy");
  if (params.get("error")) {
    title.textContent = "Login was not completed";
    msg.textContent = `${params.get("error")}: ${params.get("error_description") || ""}`;
    msg.className = "error";
  } else if (params.get("code")) {
    title.textContent = "Login code received";
    msg.textContent = "Copy this and paste it into scripts/tiktok_auth.py when it asks. It expires in a few minutes.";
    out.value = window.location.href;
    out.hidden = false;
    copy.hidden = false;
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(out.value); copy.textContent = "Copied"; }
      catch { out.select(); copy.textContent = "Press Ctrl+C"; }
    });
  }
</script>
</body>
</html>
